name: Generate machine evidence

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - "src/automated_evidence.py"
      - "tests/test_automated_evidence.py"
      - "pyproject.toml"
      - ".github/workflows/generate-machine-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Generate machine-only headline evidence
        run: >-
          python -m src.automated_evidence
          --as-of 2026-07-29
          --report build/automated-evidence-report.json

      - name: Validate generated evidence
        run: |
          python -m src schema
          python -m src inventory-schema
          python -m src taxonomy
          python -m src validate --as-of 2026-07-29

      - name: Build exploratory machine metrics
        run: >-
          python -m src analyze
          --as-of 2026-07-29
          --include-machine-only
          --output build/machine-metrics.json

      - name: Run quality checks
        run: |
          python -m ruff check .
          python -m pytest

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public-data/evidence-segments.jsonl \
            public-data/collection-manifest.json
          git add -f \
            build/automated-evidence-report.json \
            build/machine-metrics.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate machine-only headline evidence"
          git push origin "HEAD:${TARGET_BRANCH}"
