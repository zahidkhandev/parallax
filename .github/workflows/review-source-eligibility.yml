name: Review source eligibility

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: review-source-eligibility-2026-07-29
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.ref == 'review/source-eligibility-2026-07-29' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out eligibility-review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install googlenewsdecoder==0.1.7 requests beautifulsoup4 python-dateutil

      - name: Review every pending source
        run: python scripts/run_inventory_review.py

      - name: Validate inventory schema
        run: python -m src inventory-schema

      - name: Validate public data through report date
        run: python -m src validate --as-of 2026-07-29

      - name: Build inventory audit
        run: python -m src inventory-audit --output build/inventory-audit.json

      - name: Upload inventory audit
        uses: actions/upload-artifact@v4
        with:
          name: inventory-audit-2026-07-29
          path: build/inventory-audit.json

      - name: Commit reviewed inventory and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/source-inventory.jsonl
          git add -f build/inventory-audit.json
          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
            exit 0
          fi
          git commit -m "Review first source discovery candidates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
