name: Discover source candidates

on:
  workflow_dispatch:
    inputs:
      report_through:
        description: Inclusive report-through date (YYYY-MM-DD); blank uses current UTC date
        required: false
        type: string
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Select report-through date
        id: window
        env:
          REQUESTED_DATE: ${{ inputs.report_through }}
        run: echo "through=${REQUESTED_DATE:-$(date -u +%F)}" >> "$GITHUB_OUTPUT"
      - name: Execute frozen neutral queries
        run: >-
          python -m src discover
          --round methodology/collection-round-001.json
          --inventory public-data/source-inventory.jsonl
          --report-through "${{ steps.window.outputs.through }}"
          --max-results 100
      - name: Validate candidate inventory
        run: |
          python -m src inventory-schema
          python -m src validate --as-of "${{ steps.window.outputs.through }}"
          python -m src inventory-audit --output build/inventory-audit.json
      - name: Detect collection changes
        id: changes
        run: |
          if git diff --quiet -- methodology/collection-round-001.json public-data/source-inventory.jsonl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit collection branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/source-discovery-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add methodology/collection-round-001.json public-data/source-inventory.jsonl
          git commit -m "Update neutral source discovery inventory"
          git push --set-upstream origin "$BRANCH"
      - name: Open inventory review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/source-discovery-${{ github.run_id }}
          THROUGH: ${{ steps.window.outputs.through }}
        run: |
          gh pr create \
            --head "$BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "Update neutral source candidates through $THROUGH" \
            --body "Automated candidates from the frozen discovery protocol. All new URLs remain pending until scope, publisher URL, metadata, availability, language, and format are reviewed. No stance classification is performed by this workflow."
